# Project Configuration
project:
  name: "2Dto3D Video Converter"
  version: "0.1.0"
  description: "Convert 2D videos to 3D using deep learning depth estimation"
  author: "Automaker"

# Processing Settings
processing:
  # Batch size for frame processing
  batch_size: 4
  
  # Number of worker threads for parallel processing
  num_workers: 4
  
  # Use GPU acceleration if available
  use_gpu: true
  
  # GPU device ID (0 for first GPU, -1 for auto-select best)
  gpu_device: -1
  
  # Memory management
  max_memory_percent: 80  # Maximum memory usage before cleanup
  
  # Frame processing
  frame_buffer_size: 100
  
  # Enable mixed precision for faster processing
  mixed_precision: true
  
  # GPU batch size management
  auto_batch_size: true    # Automatically adjust batch size based on GPU memory
  min_batch_size: 1        # Minimum batch size when auto-adjusting
  max_batch_size: 32       # Maximum batch size when auto-adjusting
  memory_fraction: 0.8     # Maximum fraction of GPU memory to use
  
  # GPU error handling
  fallback_to_cpu: true    # Fall back to CPU if GPU errors occur
  pinned_memory: true      # Use pinned memory for faster CPU-GPU transfers
  
  # GPU optimization
  cudnn_benchmark: true    # Enable cuDNN benchmark for optimal kernels
  async_transfer: true     # Enable asynchronous data transfers
# Video Input Settings
video_input:
  # Supported input formats
  supported_formats:
    - mp4
    - avi
    - mov
    - mkv
    - webm
    - flv
  
  # Default input resolution (0 = keep original)
  default_width: 0
  default_height: 0
  
  # Frame rate (0 = keep original)
  default_fps: 0
  
  # Maximum input resolution for processing
  max_width: 3840
  max_height: 2160

# Video Output Settings
video_output:
  # Default output format
  format: mp4
  
  # Video codec
  # Standard codecs: libx264, libx265, libvpx-vp9, mpeg4, prores_ks, mjpeg
  # AV1 codecs (experimental): libaom-av1, libsvtav1, librav1e
  # HEVC hardware-accelerated: hevc_nvenc (NVIDIA), hevc_vaapi (Linux), hevc_qsv (Intel), hevc_videotoolbox (macOS)
  # VR-optimized: hevc_vr, av1_vr
  codec: libx264
  
  # Quality preset (ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow)
  # For AV1: numeric 0-13 (SVT-AV1) or 0-8 (libaom-av1)
  # For NVENC: p1-p7
  preset: medium
  
  # CRF quality (0-51 for H.264/HEVC, 0-63 for VP9/AV1)
  # Lower = better quality, larger file. 23 is default for H.264.
  # Recommended: 18-28 for H.264, 20-30 for HEVC, 25-35 for AV1
  crf: 23
  
  # Pixel format
  # yuv420p: Most compatible, 4:2:0 chroma
  # yuv422p: 4:2:2 chroma
  # yuv444p: No chroma subsampling
  # yuv420p10le: 10-bit 4:2:0 (recommended for VR)
  # yuv422p10le: 10-bit 4:2:2
  # yuv444p10le: 10-bit 4:4:4
  pixel_format: yuv420p
  
  # Advanced codec options (optional)
  # codec_options:
  #   tune: film          # Tuning for specific content (film, animation, grain, etc.)
  #   profile: high       # Codec profile (baseline, main, high, high10, etc.)
  #   level: "4.0"        # Codec level
  #   vr_mode: false      # Enable VR-specific optimizations
  # 
  # x265_params:          # x265/HEVC specific parameters
  #   frame-threads: 2
  #   pmode: 1
  #   pme: 1
  #   aq-mode: 3
  #
  # av1_params:           # AV1 specific parameters
  #   cpu_used: 4         # Speed preset for libaom-av1 (0-8, higher = faster)
  #   lag_in_frames: 35   # Lookahead frames

depth_estimation:
  # Model to use for depth estimation
  model: midas_small  # Options: midas_small, midas_hybrid, dpt_large, dpt_hybrid, adabins_nyu, adabins_kitti
  
  # Model path (relative to models/ directory or absolute path)
  model_path: ""
  
  # Download model if not found
  auto_download: true
  
  # Depth map resolution
  output_width: 384
  output_height: 384
  
  # Depth range normalization
  min_depth: 0.0
  max_depth: 1.0
  
  # Enable temporal consistency between frames
  temporal_consistency: true
  temporal_smoothing_factor: 0.5
  
  # Model selector settings
  model_selector:
    # Primary model for depth estimation
    primary_model: adabins_nyu
    
    # Fallback model if primary fails
    fallback_model: midas_small
    
    # Enable automatic fallback on model errors
    enable_auto_fallback: true
    
    # Enable scene-adaptive model selection (indoor/outdoor)
    enable_scene_adaptation: false
    
    # Model fallback chain (in order of preference)
    fallback_chain:
      - adabins_nyu
      - midas_small
      - dpt_hybrid

  # AdaBins-specific settings
  adabins:
    # AdaBins model variant (adabins_nyu for indoor, adabins_kitti for outdoor)
    variant: adabins_nyu
    
    # Maximum depth value (10.0 for NYU, 80.0 for KITTI)
    max_depth: 10.0
# Depth Map Processing
depth_processing:
  # Edge-aware smoothing
  edge_aware_smoothing: true
  smoothing_radius: 3
  
  # Bilateral filter settings
  bilateral_filter: true
  bilateral_sigma_color: 0.1
  bilateral_sigma_space: 5
  
  # Hole filling for occlusions
  hole_filling: true
  hole_filling_method: "inpaint"  # Options: inpaint, nearest, linear
  
  # Depth sharpening
  sharpening: false
  sharpening_amount: 0.5
  
  # Depth curve adjustment for non-linear depth mapping
  # Allows artistic control over 3D effect strength
  depth_curve:
    enabled: false
    # Preset curve name (linear, s_curve, contrast_boost, soft_curve, inverse_s, shadow_lift, highlight_compress)
    # If preset is set, control_points are ignored
    preset: null  # Set to a preset name or null for custom curve
    # Custom control points (x = input depth, y = output depth), range [0, 1]
    # Must include endpoints (0,0) and (1,1) - added automatically if missing
    control_points:
      - x: 0.0
        y: 0.0
      - x: 1.0
        y: 1.0
# Stereoscopic Generation Settings
stereo_generation:
  # Output 3D format
  format: side_by_side  # Options: side_by_side, anaglyph, interlaced, vr
  
  # Baseline distance for virtual camera separation (in normalized units)
  baseline: 0.05
  
  # Focal length for depth-based rendering
  focal_length: 1.0
  
  # Convergence distance (where left and right views align)
  convergence: 0.5
  
  # Anaglyph settings (when format is 'anaglyph')
  anaglyph:
    type: red_cyan  # Options: red_cyan, green_magenta, blue_amber
    color_method: "dubois"  # Options: color, gray, half_color, dubois, optimized
  
  # Side-by-side settings
  side_by_side:
    layout: horizontal  # Options: horizontal, vertical
    swap_eyes: false
    half_width: false  # Half-resolution for each eye

  # VR output settings (when format is 'vr', 'vr_top_bottom', or 'vr180')
  vr:
    # Target resolution for VR output
    target_width: 3840  # 4K VR SBS width (1920 per eye)
    target_height: 1080  # Height for VR output

    # Interpupillary distance in meters (affects stereo separation)
    ipd: 0.063  # 63mm - average adult IPD

    # Projection type: equirectangular (360°), vr180 (180°), perspective
    projection: equirectangular  # Options: equirectangular, vr180, perspective

    # Eye ordering for VR output
    swap_eyes: false  # Set to true for cross-eye viewing

    # Use half-width mode (each eye at half resolution)
    half_width: true  # Standard for VR video players

    # Embed VR metadata in output file
    embed_metadata: true  # For VR players to recognize format

    # Quality preset for VR encoding (affects interpolation)
    quality: high  # Options: fast, balanced, high

# Quality Settings
quality:
  # Processing quality preset
  preset: balanced  # Options: fast, balanced, quality
  
  # Enable post-processing
  post_processing: true
  
  # Output quality metrics
  calculate_metrics: false

# Logging Settings
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: INFO
  
  # Log file path (empty for console only)
  file: logs/video2d3d.log
  
  # Log format
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  
  # Rotation settings
  rotation: "10 MB"
  retention: "7 days"
  
  # Enable colored output
  colorize: true

# Web API Settings (if enabled)
web_api:
  # Enable web API
  enabled: false
  
  # Host and port
  host: "0.0.0.0"
  port: 8000
  
  # API prefix
  prefix: "/api/v1"
  
  # CORS settings
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  
  # Upload settings
  max_upload_size: 500  # MB
  upload_dir: "uploads"
  
  # Rate limiting settings
  rate_limit:
    # Enable rate limiting
    enabled: true
    
    # General API rate limits
    requests_per_minute: 60
    requests_per_hour: 1000
    
    # Stricter limits for file uploads
    upload_requests_per_minute: 10
    
    # Storage backend (memory:// for single server, redis:// for distributed)
    storage_uri: "memory://"
    
    # IPs exempt from rate limiting (e.g., monitoring, internal services)
    whitelist_ips: []
# Preview Window Settings
preview:
  enabled: false
  window_name: "2Dto3D Preview"
  layout: horizontal
  scale: 0.5
  show_fps: true
  show_frame_info: true
  auto_resize: true
  max_width: 1920
  max_height: 1080
  update_interval_ms: 33

# Batch Queue Settings
batch_queue:
  max_concurrent_jobs: 1
  auto_start: true
  retry_failed: true
  max_retries: 3
  retry_delay_seconds: 5.0
  job_timeout_seconds: 3600
  output_naming_pattern: "{name}_3d{ext}"
  preserve_directory_structure: false
  skip_existing: true
  save_state: true
  state_file: "logs/batch_queue_state.json"
  state_save_interval: 30.0
  progress_update_interval: 1.0

  file_discovery:
    patterns:
      - "*.mp4"
      - "*.avi"
      - "*.mov"
      - "*.mkv"
      - "*.webm"
    exclude_patterns: []
    recursive: true
    case_sensitive: false
    max_depth: 10
    follow_symlinks: false
    min_file_size_mb: 0.0
    max_file_size_mb: 0.0

  folder_watcher:
    enabled: false
    watch_paths: []
    poll_interval_seconds: 2.0
    use_inotify: true
    stable_time_seconds: 5.0
    process_existing: true
    recursive: true

# Error Recovery Settings
error_recovery:
  # Maximum number of retry attempts per operation
  max_retries: 3
  
  # Initial delay between retries in seconds
  retry_delay_seconds: 0.1
  
  # Backoff multiplier for retry delays
  backoff_factor: 2.0
  
  # Maximum delay between retries in seconds
  max_retry_delay_seconds: 30.0
  
  # Backoff strategy: fixed, linear, exponential, fibonacci
  backoff_strategy: exponential
  
  # Model fallback chain (in order of preference)
  model_fallback_chain:
    - midas_small
    - dpt_hybrid
  
  # Fall back to CPU if GPU errors occur
  enable_cpu_fallback: true
  
  # Skip failed frames instead of raising errors
  skip_on_max_retries: false
  
  # Track failed frames for later retry
  track_failures: true
