[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2d3d"
version = "0.1.0"
description = "Convert 2D videos to 3D using deep learning depth estimation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Automaker"}
]
keywords = ["video", "3d", "depth-estimation", "stereoscopic", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0",
    "Pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "ffmpeg-python>=0.2.0",
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "scikit-image>=0.19.0",
    "imageio>=2.9.0",
    "imageio-ffmpeg>=0.4.0",
    "tqdm>=4.62.0",
    "rich>=12.0.0",
    "click>=8.0.0",
    "typer>=0.4.0",
    "PyYAML>=6.0",
    "python-dotenv>=0.19.0",
    "loguru>=0.6.0",
    "typing-extensions>=4.0.0",
    "psutil>=5.8.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-asyncio>=0.18.0",
    "pytest-mock>=3.6.0",
    "black>=22.0.0",
    "ruff>=0.0.200",
    "mypy>=0.950",
    "isort>=5.10.0",
    "pre-commit>=2.17.0",
    "types-PyYAML>=6.0.0",
    "types-Pillow>=9.0.0",
]
web = [
    "fastapi>=0.75.0",
    "uvicorn>=0.17.0",
    "python-multipart>=0.0.5",
    "flask>=2.0.0",
]
viz = [
    "matplotlib>=3.5.0",
]
gui = [
    "PyQt6>=6.4.0",
]
[project.scripts]
video2d3d = "video2d3d.cli:main"
v2d3d = "video2d3d.cli:main"

[project.urls]
Homepage = "https://github.com/automaker/2dto3d"
Documentation = "https://github.com/automaker/2dto3d#readme"
Repository = "https://github.com/automaker/2dto3d"
Issues = "https://github.com/automaker/2dto3d/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video2d3d = ["py.typed"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | models
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["video2d3d"]
# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
    "ARG001", # unused function argument
]

[tool.ruff.lint.isort]
known-first-party = ["video2d3d"]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "torch.*",
    "torchvision.*",
    "numpy.*",
    "scipy.*",
    "PIL.*",
    "imageio.*",
    "ffmpeg.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=video2d3d --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/video2d3d"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
