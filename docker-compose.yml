# =============================================================================
# 2Dto3D Video Converter - Docker Compose (GPU)
# =============================================================================
# Docker Compose configuration for GPU-enabled deployment
# Requires: NVIDIA Container Toolkit (nvidia-docker2)
#
# Usage:
#   docker-compose up -d                    # Start main service
#   docker-compose --profile api up -d      # Start API server
#   docker-compose --profile batch up -d    # Start batch processing
#   docker-compose logs -f                  # View logs
#   docker-compose down                     # Stop services
#
# Prerequisites:
#   - Docker 19.03+
#   - NVIDIA Driver 470+
#   - NVIDIA Container Toolkit
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Main Application Service (GPU)
  # ---------------------------------------------------------------------------
  video2d3d:
    build:
      context: .
      dockerfile: Dockerfile
    image: video2d3d:gpu
    container_name: video2d3d-gpu
    
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # Environment Configuration
    environment:
      - VIDEO2D3D_ENV=${VIDEO2D3D_ENV:-production}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - VIDEO2D3D_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8000}
      - VIDEO2D3D_BATCH_SIZE=${BATCH_SIZE:-4}
      - VIDEO2D3D_NUM_WORKERS=${NUM_WORKERS:-4}
    
    # Port Mapping
    ports:
      - "${API_PORT:-8000}:8000"
    
    # Volume Mounts
    volumes:
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs:rw
      - models_data:/app/models
      - ./logs:/app/logs:rw
      - ./config:/app/config:ro
    
    # Health Check
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Restart Policy
    restart: unless-stopped
    
    # Logging Configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    # Security Options
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # API Server Service (GPU) - Dedicated API Instance
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: video2d3d:gpu
    container_name: video2d3d-api
    
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    
    # Environment Configuration
    environment:
      - VIDEO2D3D_ENV=${VIDEO2D3D_ENV:-production}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - VIDEO2D3D_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8000}
    
    # Port Mapping
    ports:
      - "${API_PORT:-8000}:8000"
    
    # Volume Mounts
    volumes:
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs:rw
      - models_data:/app/models
      - ./logs:/app/logs:rw
      - ./config:/app/config:ro
    
    # Health Check
    healthcheck:
      test: ["CMD", "/healthcheck.sh", "serve"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Restart Policy
    restart: unless-stopped
    
    # Logging Configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    # Security Options
    security_opt:
      - no-new-privileges:true
    
    profiles:
      - api

  # ---------------------------------------------------------------------------
  # Batch Processing Service (GPU)
  # ---------------------------------------------------------------------------
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    image: video2d3d:gpu
    container_name: video2d3d-batch
    
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    command: ["batch-convert", "/app/inputs", "--output-dir", "/app/outputs"]
    
    # Environment Configuration
    environment:
      - VIDEO2D3D_ENV=${VIDEO2D3D_ENV:-production}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - VIDEO2D3D_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VIDEO2D3D_BATCH_SIZE=${BATCH_SIZE:-4}
      - VIDEO2D3D_NUM_WORKERS=${NUM_WORKERS:-4}
    
    # Volume Mounts
    volumes:
      - ./inputs:/app/inputs:ro
      - ./outputs:/app/outputs:rw
      - models_data:/app/models
      - ./logs:/app/logs:rw
      - ./config:/app/config:ro
    
    # Restart Policy - Don't restart batch jobs automatically
    restart: "no"
    
    # Logging Configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    # Security Options
    security_opt:
      - no-new-privileges:true
    
    profiles:
      - batch

# =============================================================================
# Named Volumes - For persistent data
# =============================================================================
volumes:
  models_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: video2d3d-network
    driver: bridge
