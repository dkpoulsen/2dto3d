# =============================================================================
# 2Dto3D Video Converter - Kubernetes Ingress
# =============================================================================
# Ingress configuration for external access with load balancing
# 
# Prerequisites:
#   - Kubernetes Ingress Controller (nginx, traefik, istio, etc.)
#   - For TLS: cert-manager or manual certificate management
# 
# Usage:
#   kubectl apply -f ingress.yaml
# =============================================================================

---
# Main Ingress (nginx ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video2d3d-ingress
  namespace: video2d3d
  labels:
    app.kubernetes.io/name: video2d3d
    app.kubernetes.io/component: ingress
  annotations:
    # Enable CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    
    # Request body size (for video uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # SSL redirect (enable in production)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # cert-manager for automatic TLS (if installed)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # WebSocket support (for real-time progress updates)
    nginx.ingress.kubernetes.io/websocket-services: "video2d3d-api"
    
    # Backend protocol
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  # Use ingressClassName instead of deprecated kubernetes.io/ingress.class annotation
  ingressClassName: nginx
  
  # TLS configuration (uncomment and configure for production)
  # tls:
  #   - hosts:
  #       - video2d3d.example.com
  #     secretName: video2d3d-tls
  
  rules:
    - host: video2d3d.example.com  # Replace with your domain
      http:
        paths:
          # API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: video2d3d-api
                port:
                  number: 80
          
          # Health endpoints
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: video2d3d-api
                port:
                  number: 80
          
          # OpenAPI docs
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: video2d3d-api
                port:
                  number: 80
          
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: video2d3d-api
                port:
                  number: 80
          
          - path: /openapi
            pathType: Prefix
            backend:
              service:
                name: video2d3d-api
                port:
                  number: 80
          
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video2d3d-api
                port:
                  number: 80

---
# Ingress for internal access (if needed)
# Uncomment and configure for internal-only access
# apiVersion: networking.k8s.io/v1
