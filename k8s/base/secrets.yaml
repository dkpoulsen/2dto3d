# =============================================================================
# 2Dto3D Video Converter - Kubernetes Secrets Template
# =============================================================================
# Template for sensitive configuration
# 
# IMPORTANT: This is a TEMPLATE file. Do not commit with real secrets!
# 
# To create secrets from this template:
#   1. Copy this file to secrets.yaml.local
#   2. Replace placeholder values with actual secrets
#   3. Apply: kubectl apply -f secrets.yaml.local
#   4. Delete the local file: rm secrets.yaml.local
# 
# Or use kubectl to create secrets directly:
#   kubectl create secret generic video2d3d-secrets \
#     --from-literal=API_KEY=your-api-key \
#     -n video2d3d
# 
# For production, use external secret management:
#   - HashiCorp Vault
#   - AWS Secrets Manager
#   - Azure Key Vault
#   - Google Secret Manager
#   - Kubernetes External Secrets Operator
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: video2d3d-secrets
  namespace: video2d3d
  labels:
    app.kubernetes.io/name: video2d3d
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # API Authentication (optional - enable if needed)
  # API_KEY: "your-secure-api-key-here"
  # API_SECRET: "your-secure-api-secret-here"
  
  # Database credentials (if using external database)
  # DB_HOST: "postgres.example.com"
  # DB_PORT: "5432"
  # DB_NAME: "video2d3d"
  # DB_USER: "video2d3d"
  # DB_PASSWORD: "your-secure-db-password"
  
  # Storage credentials (for S3/GCS/Azure Blob)
  # AWS_ACCESS_KEY_ID: "your-access-key"
  # AWS_SECRET_ACCESS_KEY: "your-secret-key"
  # S3_BUCKET: "video2d3d-storage"
  # S3_REGION: "us-east-1"
  
  # Monitoring/observability
  # SENTRY_DSN: "https://your-sentry-dsn"
  # DATADOG_API_KEY: "your-datadog-key"
---
