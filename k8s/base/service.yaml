# =============================================================================
# 2Dto3D Video Converter - Kubernetes Service
# =============================================================================
# Service for load balancing and service discovery
# 
# Usage:
#   kubectl apply -f service.yaml
# =============================================================================

---
# Main API Service (ClusterIP)
# Primary service for internal cluster communication
apiVersion: v1
kind: Service
metadata:
  name: video2d3d-api
  namespace: video2d3d
  labels:
    app.kubernetes.io/name: video2d3d
    app.kubernetes.io/component: api-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: video2d3d
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# Headless Service for StatefulSet (if needed)
# Allows direct pod-to-pod communication
apiVersion: v1
kind: Service
metadata:
  name: video2d3d-api-headless
  namespace: video2d3d
  labels:
    app.kubernetes.io/name: video2d3d
    app.kubernetes.io/component: api-headless
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  selector:
    app.kubernetes.io/name: video2d3d
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
