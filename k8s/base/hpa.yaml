# =============================================================================
# 2Dto3D Video Converter - Horizontal Pod Autoscaler
# =============================================================================
# Auto-scaling configuration based on CPU, memory, and custom metrics
# 
# Prerequisites:
#   - Kubernetes Metrics Server installed
#   - For custom metrics: Prometheus Adapter
# 
# Usage:
#   kubectl apply -f hpa.yaml
# =============================================================================

---
# CPU and Memory-based HPA (Default)
# This is the primary HPA - only ONE HPA can target a deployment
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: video2d3d-api-hpa
  namespace: video2d3d
  labels:
    app.kubernetes.io/name: video2d3d
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: video2d3d-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # CPU utilization target
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale when CPU > 70%
    
    # Memory utilization target
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Scale when memory > 80%
  
  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 10  # Scale down max 10% of pods at a time
          periodSeconds: 60
        - type: Pods
          value: 1  # Or scale down max 1 pod at a time
          periodSeconds: 60
      selectPolicy: Min  # Use the more conservative policy
    
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 1 minute before scaling up again
      policies:
        - type: Percent
          value: 100  # Double the pods when needed
          periodSeconds: 15
        - type: Pods
          value: 4  # Or add max 4 pods at a time
          periodSeconds: 15
      selectPolicy: Max  # Use the more aggressive policy

---
