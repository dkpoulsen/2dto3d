---
# GPU-aware scaling with PriorityClass
# For clusters with limited GPU resources
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: video2d3d-gpu-high-priority
  labels:
    app.kubernetes.io/name: video2d3d
value: 1000000
globalDefault: false
description: "High priority for video2d3d GPU workloads"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: video2d3d-gpu-preemptible
  labels:
    app.kubernetes.io/name: video2d3d
value: 100
globalDefault: false
description: "Low priority for preemptible video2d3d GPU workloads"
