# =============================================================================
# 2Dto3D Video Converter - Development Overlay
# =============================================================================
# Development environment configuration with reduced resources
# and relaxed security for easier debugging
# 
# Usage:
#   kubectl apply -k k8s/overlays/dev/
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference base
resources:
  - ../../base

# Namespace override
namespace: video2d3d-dev

# Development labels
commonLabels:
  environment: development
  app.kubernetes.io/instance: dev

# Development images
images:
  - name: video2d3d
    newName: video2d3d
    newTag: "dev-gpu"

# ConfigMap overrides
configMapGenerator:
  - name: video2d3d-config
    behavior: merge
    literals:
      - VIDEO2D3D_ENV=development
      - VIDEO2D3D_LOG_LEVEL=DEBUG
      - VIDEO2D3D_BATCH_SIZE=2
      - VIDEO2D3D_NUM_WORKERS=2

# Patches for development
patches:
  # Reduce replicas
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: video2d3d-api
  
  # Reduce resource requests
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
    target:
      kind: Deployment
      name: video2d3d-api
  
  # Disable HPA in dev
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: video2d3d-api-hpa
