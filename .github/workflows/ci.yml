name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # Coverage threshold - fail if below this percentage
  COVERAGE_FAIL_UNDER: "60"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy isort

      - name: Run Black (code formatting check)
        run: black --check --diff src/video2d3d tests

      - name: Run Ruff (linting)
        run: ruff check src/video2d3d tests

      - name: Run isort (import sorting check)
        run: isort --check-only --diff src/video2d3d tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          # Install dev requirements if available, otherwise production + test deps
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
            pip install pytest pytest-cov pytest-asyncio pytest-mock pytest-xdist
          fi
          # Install package in editable mode
          pip install -e .

      - name: Verify installation
        shell: bash
        run: |
          python -c "import sys; print(f'Python {sys.version}')"
          python -c "import torch; print(f'PyTorch {torch.__version__}')" || echo "PyTorch not available (expected in mocked env)"
          python -c "import cv2; print(f'OpenCV {cv2.__version__}')" || echo "OpenCV not available (expected in mocked env)"

      - name: Run tests with coverage
        shell: bash
        run: |
          pytest \
            --cov=src/video2d3d \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-report=term-missing \
            --junitxml=test-results-${{ matrix.python-version }}.xml \
            -v \
            --tb=short \
            --durations=20 \
            -n 2 \
            --timeout=120 \
            -m "not slow and not gpu" \
            tests/
            --cov=src/video2d3d \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_FAIL_UNDER }} \
            --junitxml=test-results-${{ matrix.python-version }}.xml \
            -v \
            --tb=short \
            -n auto \
            -m "not slow and not gpu" \
            tests/
        env:
          CI: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11' && success()
        with:
          files: coverage-${{ matrix.python-version }}.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    # Run integration tests only if unit tests pass or this is a manual dispatch
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
            pip install pytest pytest-cov pytest-asyncio pytest-mock pytest-xdist
          fi
          pip install -e .

      - name: Run integration tests
        shell: bash
        run: |
          pytest \
            --cov=src/video2d3d \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junitxml=test-results-integration.xml \
            -v \
            --tb=short \
            -m "integration and not slow and not gpu" \
            tests/
        env:
          CI: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: |
            test-results-integration.xml
            coverage-integration.xml
          retention-days: 30

  # GPU tests - runs only on manual dispatch or when commit message contains [gpu-test]
  test-gpu:
    name: GPU Tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[gpu-test]')
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gpu-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-gpu-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
            pip install pytest pytest-cov pytest-asyncio pytest-mock pytest-xdist
          fi
          pip install -e .

      - name: Run GPU tests
        shell: bash
        run: |
          pytest \
            --cov=src/video2d3d \
            --cov-report=xml:coverage-gpu.xml \
            --cov-report=term-missing \
            --junitxml=test-results-gpu.xml \
            -v \
            --tb=short \
            -m "gpu" \
            tests/
        env:
          CI: "1"
          CUDA_VISIBLE_DEVICES: "0"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-gpu
          path: |
            test-results-gpu.xml
            coverage-gpu.xml
          retention-days: 30

  # Summary job for branch protection - includes ALL test jobs
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, test-integration]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: Check CI status
        shell: bash
        run: |
          FAILED=0
          
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            echo "::error::Lint job failed"
            FAILED=1
          fi
          
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "::error::Test job failed"
            FAILED=1
          fi
          
          if [[ "${{ needs.test-integration.result }}" == "failure" ]]; then
            echo "::error::Integration test job failed"
            FAILED=1
          fi
          
          # Don't fail on skipped jobs, but log them
          if [[ "${{ needs.test-integration.result }}" == "skipped" ]]; then
            echo "::notice::Integration tests were skipped"
          fi
          
          if [[ $FAILED -eq 1 ]]; then
            echo "CI failed"
            exit 1
          fi
          
          echo "CI passed"
