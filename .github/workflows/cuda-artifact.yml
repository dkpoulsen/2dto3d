name: CUDA Build Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: video2d3d-gpu
  CUDA_VERSION: "12.1.0"

jobs:
  build-cuda-artifact:
    name: Build CUDA image artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: vars
        run: |
          REF="${GITHUB_REF#refs/}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            TAG="${GITHUB_REF#refs/heads/}"
          else
            TAG="manual"
          fi
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "image-tag=${{ env.IMAGE_NAME }}:${TAG}-cuda${{ env.CUDA_VERSION }}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${{ env.IMAGE_NAME }}-${TAG}-cuda${{ env.CUDA_VERSION }}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.vars.outputs.image-tag }}
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify CUDA image
        run: |
          docker images "${{ env.IMAGE_NAME }}"
          docker run --rm --entrypoint python3 "${{ steps.vars.outputs.image-tag }}" -c "import torch; assert torch.version.cuda; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: Export image tarball
        run: |
          mkdir -p dist
          docker save "${{ steps.vars.outputs.image-tag }}" | gzip > "dist/${{ steps.vars.outputs.artifact-name }}.tar.gz"
          sha256sum "dist/${{ steps.vars.outputs.artifact-name }}.tar.gz" > "dist/${{ steps.vars.outputs.artifact-name }}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact-name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30
          if-no-files-found: error
